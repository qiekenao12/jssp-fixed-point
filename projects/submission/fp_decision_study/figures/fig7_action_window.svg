  <g id="text_25">
   <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #444444" transform="translate(138.217875 224.09016)">Changing the declared window from one atomic call to 480 requests reverses the aggregate LS/VND ordering.</text>
   <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #444444" transform="translate(256.303953 232.972184)">Requests are not wall time or unique decodes.</text>
  </g>
 </g>
